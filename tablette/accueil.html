<title>Accueil Tablette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: écran d'accueil paysage en grille — horloge + météo en haut, divertissement + agenda dessous ; une colonne sur téléphone. Look sombre assumé. */
:root {
  --bg: #0b0f1a;
  --bg-glow-1: rgba(255, 140, 90, 0.16);
  --bg-glow-2: rgba(70, 130, 255, 0.14);
  --surface: rgba(255, 255, 255, 0.045);
  --surface-hi: rgba(255, 255, 255, 0.085);
  --line: rgba(255, 255, 255, 0.09);
  --fg: #eef1f8;
  --muted: #8b93a8;
  --accent: #ff9a62;
  --accent-ink: #1a0f08;
  --sky: #7fb4ff;
  --font-display: "Outfit", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 22px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(900px 600px at 0% 0%, var(--bg-glow-1), transparent 60%),
    radial-gradient(900px 700px at 100% 100%, var(--bg-glow-2), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 18px;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 22px 24px;
  min-width: 0;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Horloge */
.clock { grid-column: span 7; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; background: transparent; border: 0; backdrop-filter: none; -webkit-backdrop-filter: none; padding-left: 4px; }
.greet { font-family: var(--font-display); font-weight: 300; font-size: 22px; color: var(--muted); margin: 0; }
.time {
  font-family: var(--font-display);
  font-weight: 200;
  font-size: clamp(72px, 13vw, 168px);
  line-height: 0.9;
  letter-spacing: -0.04em;
  margin: 0;
  font-variant-numeric: tabular-nums;
}
.time .sec { font-size: 0.28em; color: var(--accent); font-weight: 300; letter-spacing: 0; margin-left: 0.2em; vertical-align: 0.35em; }
.date { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin: 0; text-transform: capitalize; }
.next { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.next b { color: var(--fg); font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }

/* Météo */
.weather { grid-column: span 5; display: flex; flex-direction: column; gap: 16px; }
.wnow { display: flex; align-items: center; gap: 18px; }
.wnow svg { width: 72px; height: 72px; flex: none; }
.wtemp { font-family: var(--font-display); font-weight: 300; font-size: 56px; line-height: 1; margin: 0; font-variant-numeric: tabular-nums; }
.wdesc { margin: 4px 0 0; color: var(--muted); }
.wdays { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.wday { background: var(--surface); border-radius: 14px; padding: 10px 6px; text-align: center; font-size: 13px; }
.wday svg { width: 26px; height: 26px; display: block; margin: 6px auto; }
.wday .d { color: var(--muted); text-transform: capitalize; }
.wday .t { font-variant-numeric: tabular-nums; }
.wday .t span { color: var(--muted); }
.city-form { display: flex; gap: 8px; flex-wrap: wrap; }
.city-form input { flex: 1 1 140px; min-width: 0; background: var(--surface-hi); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }
.btn { background: var(--surface-hi); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; font-weight: 500; }
.btn:hover { background: rgba(255,255,255,0.13); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.link-btn { background: none; border: 0; color: var(--muted); font-size: 12px; letter-spacing: 0.04em; text-transform: none; padding: 2px 4px; border-radius: 6px; }
.link-btn:hover { color: var(--fg); }
.wmsg { color: var(--muted); margin: 0; font-size: 14px; }

/* Raccourcis */
.apps { grid-column: span 7; }
.group + .group { margin-top: 22px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 9px;
  text-decoration: none; color: var(--fg);
  padding: 14px 6px 12px; border-radius: 18px;
  transition: background .15s, transform .15s;
  position: relative;
}
.tile:hover { background: var(--surface-hi); }
.tile:active { transform: scale(0.96); }
.tile .ic {
  width: 58px; height: 58px; border-radius: 17px;
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 600; font-size: 24px;
  color: #fff;
  box-shadow: 0 8px 22px -10px rgba(0,0,0,.7);
}
.tile .nm { font-size: 13px; text-align: center; line-height: 1.2; overflow-wrap: anywhere; }
.tile .rm {
  position: absolute; top: 4px; right: 8px; width: 22px; height: 22px; border-radius: 50%;
  border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 14px; line-height: 22px; padding: 0;
}
.add-form { display: grid; grid-template-columns: 1fr 1.6fr auto auto; gap: 8px; margin-top: 14px; }
.add-form input { min-width: 0; background: var(--surface-hi); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }

/* Agenda */
.agenda { grid-column: span 5; display: flex; flex-direction: column; gap: 14px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-title { font-family: var(--font-display); font-weight: 500; font-size: 20px; text-transform: capitalize; margin: 0; }
.nav { display: flex; gap: 6px; }
.nav button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; font-variant-numeric: tabular-nums; }
.grid .wd { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; padding: 4px 0; }
.grid button {
  aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 12px; background: transparent;
  font-size: 14px; position: relative; padding: 0;
}
.grid button:hover { background: var(--surface-hi); }
.grid button.out { color: rgba(139,147,168,.45); }
.grid button.today { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.grid button.sel:not(.today) { outline: 1px solid var(--accent); }
.grid button.has::after { content: ""; position: absolute; bottom: 5px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--sky); }
.grid button.today.has::after { background: var(--accent-ink); }
.ev-form { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; }
.ev-form input { min-width: 0; background: var(--surface-hi); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; }
.ev-day { font-size: 13px; color: var(--muted); margin: 0; }
.ev-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ev-list li { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 10px; padding: 9px 12px; background: var(--surface); border-radius: 12px; font-size: 14px; }
.ev-list .h { color: var(--sky); font-variant-numeric: tabular-nums; font-size: 13px; }
.ev-list .x { background: none; border: 0; color: var(--muted); font-size: 16px; padding: 0 4px; }
.ev-empty { color: var(--muted); font-size: 14px; margin: 0; }
.gcal { color: var(--muted); font-size: 13px; text-decoration: none; }
.gcal:hover { color: var(--fg); }
.sample { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; text-transform: none; letter-spacing: 0; font-weight: 500; }

@media (max-width: 900px) {
  .clock, .weather, .apps, .agenda { grid-column: 1 / -1; }
}
@media (max-width: 480px) {
  .add-form { grid-template-columns: 1fr 1fr; }
  .wdays { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .wday { font-size: 12px; padding: 8px 2px; }
  .panel { padding: 18px 16px; }
}
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>

<main class="wrap">
  <section class="panel clock" aria-label="Heure">
    <p class="greet" id="greet">Bonjour</p>
    <div>
      <p class="time" id="time">--:--<span class="sec">--</span></p>
      <p class="date" id="date"></p>
    </div>
    <p class="next" id="next"><span class="dot"></span><span>Aucun rendez-vous prévu aujourd'hui</span></p>
  </section>

  <section class="panel weather" aria-label="Météo">
    <h2 class="label"><span>Météo <span id="wcity"></span></span><button class="link-btn" id="wchange" type="button">Changer de ville</button></h2>
    <div id="wbody"><p class="wmsg">Chargement de la météo…</p></div>
    <form class="city-form" id="cityForm" hidden>
      <input id="cityInput" type="text" placeholder="Ta ville (ex. Lyon, Dakar…)" autocomplete="off" aria-label="Ville">
      <button class="btn primary" type="submit">Valider</button>
      <button class="btn" type="button" id="geoBtn">Ma position</button>
    </form>
  </section>

  <section class="panel apps" aria-label="Applications">
    <div class="group">
      <h2 class="label"><span>Films &amp; séries</span><button class="link-btn" id="editBtn" type="button">Modifier</button></h2>
      <div class="tiles" id="tiles-video"></div>
    </div>
    <div class="group">
      <h2 class="label"><span>Musique</span></h2>
      <div class="tiles" id="tiles-music"></div>
    </div>
    <div class="group">
      <h2 class="label"><span>Mes raccourcis</span></h2>
      <div class="tiles" id="tiles-custom"></div>
      <form class="add-form" id="addForm" hidden>
        <input id="addName" type="text" placeholder="Nom" required aria-label="Nom du raccourci">
        <input id="addUrl" type="text" placeholder="Adresse (ex. instagram.com)" required aria-label="Adresse du site">
        <button class="btn primary" type="submit">Ajouter</button>
        <button class="btn" type="button" id="doneBtn">Terminé</button>
      </form>
    </div>
  </section>

  <section class="panel agenda" aria-label="Agenda">
    <div class="cal-head">
      <p class="cal-title" id="calTitle"></p>
      <div class="nav">
        <button type="button" id="prevM" aria-label="Mois précédent">‹</button>
        <button type="button" id="nextM" aria-label="Mois suivant">›</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="ev-day" id="evDay"></p>
    <ul class="ev-list" id="evList"></ul>
    <form class="ev-form" id="evForm">
      <input id="evTime" type="time" aria-label="Heure">
      <input id="evText" type="text" placeholder="Ajouter un rendez-vous…" required aria-label="Rendez-vous">
      <button class="btn primary" type="submit">Ajouter</button>
    </form>
    <a class="gcal" href="https://calendar.google.com" target="_blank" rel="noopener">Ouvrir Google Agenda ↗</a>
  </section>
</main>

<script>
(function () {
  "use strict";
  // ---------- stockage sûr ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const keyOf = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

  // ---------- horloge ----------
  function tick() {
    const now = new Date();
    $("time").innerHTML = pad(now.getHours()) + ":" + pad(now.getMinutes()) + '<span class="sec">' + pad(now.getSeconds()) + "</span>";
    $("date").textContent = now.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    const h = now.getHours();
    $("greet").textContent = h < 5 ? "Bonne nuit" : h < 18 ? "Bonjour" : "Bonsoir";
  }
  tick(); setInterval(tick, 1000);

  // ---------- raccourcis ----------
  const APPS = {
    video: [
      { n: "Netflix", u: "https://www.netflix.com", c: "#b20710", l: "N" },
      { n: "YouTube", u: "https://www.youtube.com", c: "#d62020", l: "▶" },
      { n: "Prime Video", u: "https://www.primevideo.com", c: "#1f6fd1", l: "P" },
      { n: "Disney+", u: "https://www.disneyplus.com", c: "#173a8c", l: "D+" },
      { n: "Canal+", u: "https://www.canalplus.com", c: "#2a2a2a", l: "C+" }
    ],
    music: [
      { n: "Spotify", u: "https://open.spotify.com", c: "#1aa34a", l: "S" },
      { n: "YouTube Music", u: "https://music.youtube.com", c: "#c41d1d", l: "♪" },
      { n: "Deezer", u: "https://www.deezer.com", c: "#7a3cff", l: "D" },
      { n: "SoundCloud", u: "https://soundcloud.com", c: "#e8661a", l: "SC" }
    ]
  };
  let custom = store.get("tab.custom", [
    { n: "Chrome", u: "https://www.google.com", c: "#3b6fd8", l: "G" },
    { n: "Gmail", u: "https://mail.google.com", c: "#c5402f", l: "M" },
    { n: "Photos", u: "https://photos.google.com", c: "#d49a1a", l: "P" }
  ]);
  let editing = false;
  const PALETTE = ["#3b6fd8", "#c5402f", "#1aa34a", "#7a3cff", "#d49a1a", "#1b9aa6", "#c2347e", "#555c6e"];

  function tile(a, removable, idx) {
    const el = document.createElement("a");
    el.className = "tile"; el.href = a.u; el.target = "_blank"; el.rel = "noopener";
    const ic = document.createElement("span"); ic.className = "ic"; ic.style.background = a.c; ic.textContent = a.l;
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = a.n;
    el.append(ic, nm);
    if (removable && editing) {
      const rm = document.createElement("button"); rm.className = "rm"; rm.type = "button"; rm.textContent = "×";
      rm.setAttribute("aria-label", "Retirer " + a.n);
      rm.addEventListener("click", (e) => { e.preventDefault(); custom.splice(idx, 1); store.set("tab.custom", custom); renderApps(); });
      el.appendChild(rm);
    }
    return el;
  }
  function renderApps() {
    $("tiles-video").replaceChildren(...APPS.video.map((a) => tile(a)));
    $("tiles-music").replaceChildren(...APPS.music.map((a) => tile(a)));
    $("tiles-custom").replaceChildren(...custom.map((a, i) => tile(a, true, i)));
    $("addForm").hidden = !editing;
    $("editBtn").textContent = editing ? "Terminé" : "Modifier";
  }
  $("editBtn").addEventListener("click", () => { editing = !editing; renderApps(); });
  $("doneBtn").addEventListener("click", () => { editing = false; renderApps(); });
  $("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const n = $("addName").value.trim(); let u = $("addUrl").value.trim();
    if (!n || !u) return;
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    custom.push({ n, u, c: PALETTE[custom.length % PALETTE.length], l: n.slice(0, 1).toUpperCase() });
    store.set("tab.custom", custom);
    $("addName").value = ""; $("addUrl").value = "";
    renderApps();
  });
  renderApps();

  // ---------- météo (Open-Meteo, sans clé) ----------
  const ICON = {
    sun: '<svg viewBox="0 0 48 48" fill="none" stroke="#ffc46b" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="24" r="9" fill="#ffc46b"/><path d="M24 4v5M24 39v5M4 24h5M39 24h5M9.9 9.9l3.5 3.5M34.6 34.6l3.5 3.5M9.9 38.1l3.5-3.5M34.6 13.4l3.5-3.5"/></svg>',
    partly: '<svg viewBox="0 0 48 48" fill="none"><circle cx="18" cy="18" r="8" fill="#ffc46b"/><path d="M16 38h20a8 8 0 0 0 0-16 11 11 0 0 0-20.5 3A6.5 6.5 0 0 0 16 38z" fill="#cfd6e6"/></svg>',
    cloud: '<svg viewBox="0 0 48 48" fill="none"><path d="M14 36h22a9 9 0 0 0 0-18 12 12 0 0 0-22.5 3.5A7.3 7.3 0 0 0 14 36z" fill="#aeb7cb"/></svg>',
    fog: '<svg viewBox="0 0 48 48" fill="none" stroke="#aeb7cb" stroke-width="3" stroke-linecap="round"><path d="M8 18h32M5 26h38M10 34h28"/></svg>',
    rain: '<svg viewBox="0 0 48 48" fill="none"><path d="M14 30h22a9 9 0 0 0 0-18 12 12 0 0 0-22.5 3.5A7.3 7.3 0 0 0 14 30z" fill="#aeb7cb"/><path d="M17 35l-2 6M25 35l-2 6M33 35l-2 6" stroke="#7fb4ff" stroke-width="3" stroke-linecap="round"/></svg>',
    snow: '<svg viewBox="0 0 48 48" fill="none"><path d="M14 30h22a9 9 0 0 0 0-18 12 12 0 0 0-22.5 3.5A7.3 7.3 0 0 0 14 30z" fill="#cfd6e6"/><g fill="#eef1f8"><circle cx="17" cy="38" r="2.2"/><circle cx="25" cy="41" r="2.2"/><circle cx="33" cy="38" r="2.2"/></g></svg>',
    storm: '<svg viewBox="0 0 48 48" fill="none"><path d="M14 30h22a9 9 0 0 0 0-18 12 12 0 0 0-22.5 3.5A7.3 7.3 0 0 0 14 30z" fill="#8f98ad"/><path d="M25 31l-5 8h6l-3 7 8-10h-6l3-5z" fill="#ffc46b"/></svg>'
  };
  function wmo(c) {
    if (c === 0) return ["sun", "Ciel dégagé"];
    if (c <= 2) return ["partly", "Partiellement nuageux"];
    if (c === 3) return ["cloud", "Couvert"];
    if (c <= 48) return ["fog", "Brouillard"];
    if (c <= 57) return ["rain", "Bruine"];
    if (c <= 67) return ["rain", "Pluie"];
    if (c <= 77) return ["snow", "Neige"];
    if (c <= 82) return ["rain", "Averses"];
    if (c <= 86) return ["snow", "Averses de neige"];
    return ["storm", "Orage"];
  }
  function showCityForm(msg) {
    $("cityForm").hidden = false;
    if (msg) $("wbody").innerHTML = '<p class="wmsg"></p>', $("wbody").firstChild.textContent = msg;
  }
  async function loadWeather(loc) {
    $("wcity").textContent = loc.name ? "· " + loc.name : "";
    try {
      const url = "https://api.open-meteo.com/v1/forecast?latitude=" + loc.lat + "&longitude=" + loc.lon +
        "&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5";
      const r = await fetch(url);
      if (!r.ok) throw new Error();
      const d = await r.json();
      const [ic, label] = wmo(d.current.weather_code);
      let html = '<div class="wnow">' + ICON[ic] + '<div><p class="wtemp">' + Math.round(d.current.temperature_2m) + '°</p>' +
        '<p class="wdesc">' + label + " · vent " + Math.round(d.current.wind_speed_10m) + " km/h · humidité " + d.current.relative_humidity_2m + "%</p></div></div>";
      html += '<div class="wdays">';
      d.daily.time.forEach((t, i) => {
        const day = i === 0 ? "Auj." : new Date(t + "T12:00").toLocaleDateString("fr-FR", { weekday: "short" });
        html += '<div class="wday"><div class="d">' + day + "</div>" + ICON[wmo(d.daily.weather_code[i])[0]] +
          '<div class="t">' + Math.round(d.daily.temperature_2m_max[i]) + "° <span>" + Math.round(d.daily.temperature_2m_min[i]) + "°</span></div></div>";
      });
      $("wbody").innerHTML = html + "</div>";
      $("cityForm").hidden = true;
    } catch (e) {
      showCityForm("La météo n'a pas pu se charger ici. Ouvre cette page directement dans le navigateur de ta tablette (Chrome) pour l'avoir en direct.");
    }
  }
  async function findCity(q) {
    try {
      const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&name=" + encodeURIComponent(q));
      const d = await r.json();
      if (!d.results || !d.results.length) { showCityForm("Ville introuvable. Vérifie l'orthographe."); return; }
      const c = d.results[0];
      const loc = { lat: c.latitude, lon: c.longitude, name: c.name };
      store.set("tab.loc", loc); loadWeather(loc);
    } catch (e) {
      showCityForm("La recherche de ville n'est pas disponible ici. Ouvre la page dans Chrome sur ta tablette.");
    }
  }
  function useGeo() {
    if (!navigator.geolocation) { showCityForm("Indique ta ville pour voir la météo."); return; }
    navigator.geolocation.getCurrentPosition(
      (p) => { const loc = { lat: p.coords.latitude.toFixed(3), lon: p.coords.longitude.toFixed(3), name: "Ma position" }; store.set("tab.loc", loc); loadWeather(loc); },
      () => showCityForm("Indique ta ville pour voir la météo."),
      { timeout: 8000 }
    );
  }
  $("cityForm").addEventListener("submit", (e) => { e.preventDefault(); const q = $("cityInput").value.trim(); if (q) findCity(q); });
  $("geoBtn").addEventListener("click", useGeo);
  $("wchange").addEventListener("click", () => { $("cityForm").hidden = !$("cityForm").hidden; if (!$("cityForm").hidden) $("cityInput").focus(); });
  const saved = store.get("tab.loc", null);
  if (saved) loadWeather(saved); else useGeo();
  setInterval(() => { const l = store.get("tab.loc", null); if (l) loadWeather(l); }, 30 * 60 * 1000);

  // ---------- agenda ----------
  const today = new Date();
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  let selected = keyOf(today);
  let events = store.get("tab.events", null);
  if (!events) {
    // exemples pour montrer le fonctionnement — supprimables
    const t1 = new Date(today); t1.setDate(t1.getDate() + 2);
    const t2 = new Date(today); t2.setDate(t2.getDate() + 5);
    events = {};
    events[keyOf(today)] = [{ h: "20:30", t: "Soirée film (exemple)" }];
    events[keyOf(t1)] = [{ h: "10:00", t: "Rendez-vous (exemple)" }];
    events[keyOf(t2)] = [{ h: "", t: "Anniversaire (exemple)" }];
  }
  const saveEv = () => store.set("tab.events", events);

  function renderCal() {
    $("calTitle").textContent = view.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
    const g = $("grid"); g.replaceChildren();
    ["L", "M", "M", "J", "V", "S", "D"].forEach((w) => { const s = document.createElement("div"); s.className = "wd"; s.textContent = w; g.appendChild(s); });
    const first = (view.getDay() + 6) % 7;
    const start = new Date(view); start.setDate(1 - first);
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const k = keyOf(d);
      const b = document.createElement("button"); b.type = "button"; b.textContent = d.getDate();
      if (d.getMonth() !== view.getMonth()) b.classList.add("out");
      if (k === keyOf(today)) b.classList.add("today");
      if (k === selected) b.classList.add("sel");
      if (events[k] && events[k].length) b.classList.add("has");
      b.setAttribute("aria-label", d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }));
      b.addEventListener("click", () => { selected = k; if (d.getMonth() !== view.getMonth()) view = new Date(d.getFullYear(), d.getMonth(), 1); renderCal(); });
      g.appendChild(b);
    }
    renderEvents();
  }
  function renderEvents() {
    const [y, m, dd] = selected.split("-").map(Number);
    const sd = new Date(y, m - 1, dd);
    $("evDay").textContent = selected === keyOf(today) ? "Aujourd'hui" : sd.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
    const list = (events[selected] || []).slice().sort((a, b) => (a.h || "99").localeCompare(b.h || "99"));
    const ul = $("evList"); ul.replaceChildren();
    if (!list.length) { const li = document.createElement("p"); li.className = "ev-empty"; li.textContent = "Rien de prévu ce jour-là."; ul.appendChild(li); }
    list.forEach((ev) => {
      const li = document.createElement("li");
      const h = document.createElement("span"); h.className = "h"; h.textContent = ev.h || "Journée";
      const t = document.createElement("span"); t.textContent = ev.t;
      const x = document.createElement("button"); x.className = "x"; x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "Supprimer " + ev.t);
      x.addEventListener("click", () => { events[selected] = events[selected].filter((e) => e !== ev); saveEv(); renderCal(); updateNext(); });
      li.append(h, t, x); ul.appendChild(li);
    });
  }
  function updateNext() {
    const now = new Date(); const hm = pad(now.getHours()) + ":" + pad(now.getMinutes());
    const list = (events[keyOf(now)] || []).filter((e) => !e.h || e.h >= hm).sort((a, b) => (a.h || "").localeCompare(b.h || ""));
    const el = $("next").lastElementChild;
    if (list.length) { el.innerHTML = "Prochain : <b></b>"; el.querySelector("b").textContent = (list[0].h ? list[0].h + " · " : "") + list[0].t; }
    else el.textContent = "Aucun autre rendez-vous aujourd'hui";
  }
  $("prevM").addEventListener("click", () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderCal(); });
  $("nextM").addEventListener("click", () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCal(); });
  $("evForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const t = $("evText").value.trim(); if (!t) return;
    (events[selected] = events[selected] || []).push({ h: $("evTime").value, t });
    saveEv(); $("evText").value = ""; $("evTime").value = "";
    renderCal(); updateNext();
  });
  renderCal(); updateNext(); setInterval(updateNext, 60000);
})();
</script>
